name: FrozenWorld
version: '${version}'
main: dev.frozenworld.FrozenWorldPlugin
api-version: '1.21'
author: FrozenWorld
description: Вечная зима — управление заморозкой мира, снегом и зимними настройками.
commands:
  frozenworld:
    description: Открыть меню FrozenWorld
    usage: /frozenworld
