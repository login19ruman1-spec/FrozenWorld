# FrozenWorld — Paper 1.21.4 / Java 21
worlds:
  # Пусто = все миры.
  enabled: []

winter:
  start-frozen: false
  stop-time-on-enable: false

time:
  stop-on-winter: false
  resume-on-winter-disable: true
  stopped: false

snow:
  enabled: true
  layers-per-cycle: 1

water:
  enabled: true

heat:
  radius: 3

performance:
  # Сколько колонок уже загруженных чанков обрабатывается за один цикл.
  # Увеличение ускоряет снег/лёд, но повышает нагрузку.
  columns-per-pulse: 96
